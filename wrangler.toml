name = "silo-arkiv"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static site (public/) is served for free; /api/* and /media/* go to the worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/media/*"]

# Daily clean-up of unfinished uploads.
[triggers]
crons = ["23 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "silo-arkiv"
database_id = "REPLACE_WITH_D1_DATABASE_ID"   # see README → "Updating the worker later"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "silo-arkiv"

[vars]
# Public Turnstile site key (for local testing use the always-passing test key 1x00000000000000000000AA via .dev.vars).
TURNSTILE_SITE_KEY = "0x4AAAAAAFNXcGxm9JQyNYTX"
# Max size of a single file in MB, and max files per contribution.
MAX_FILE_MB = "2048"
MAX_FILES = "40"
# "post" = contributions are shown right away (admin can hide them afterwards)
# "pre"  = contributions must be approved in /admin.html before they are shown
MODERATION = "post"
# Leave empty to serve media through the worker (/media/...). Keep it empty to stay inside the
# spending guard: reads through the worker are capped by the Workers Free plan, reads from a public
# bucket domain are not.
MEDIA_BASE_URL = ""
# Repository whose "Behandl uploads" workflow converts the uploads (needs GITHUB_TOKEN secret).
GITHUB_REPO = "sloev/svendborg-skyline"
# Spending guard (see src/worker.js). Worst case with these values: (250 − 10) GB × $0.015 ≈ $3.60/month.
STORAGE_LIMIT_GB = "250"
CLASS_A_MONTHLY_LIMIT = "900000"
# Websites allowed to call the API from the browser (CORS), comma separated.
# Needed when the site is hosted on GitHub Pages, e.g. "https://sloev.github.io".
ALLOWED_ORIGINS = "https://sloev.github.io"
# Shown in the footer / privacy section.
CONTACT_EMAIL = "fremmedartet@gmail.com"

# Secrets (set with `npx wrangler secret put NAME`, or in .dev.vars locally):
#   TURNSTILE_SECRET  – Turnstile secret key
#   ADMIN_TOKEN       – long random string, used by /admin.html and the processor
#   IP_SALT           – random string used to hash IP addresses for rate limiting
#   GITHUB_TOKEN      – (optional, from the GitHub secret DISPATCH_TOKEN) fine-grained token with "Contents: read & write" on GITHUB_REPO,
#                       used to start processing right after an upload instead of waiting for the hourly run
