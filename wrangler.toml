name = "silo-arkiv"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Daglig oprydning i uploads, der aldrig blev gjort færdige.
[triggers]
crons = ["23 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "silo-arkiv"
# Det rigtige id sættes kun under udgivelse (find det med `npx wrangler d1 list`). Commit det ikke.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "silo-arkiv"

# Loft pr. IP-adresse pr. minut (Cloudflares indbyggede rate limiting; koster ikke noget).
[[ratelimits]]
name = "RL_READ"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[vars]
# Offentlig Turnstile-nøgle (lokalt bruges testnøglen 1x00000000000000000000AA via .dev.vars).
TURNSTILE_SITE_KEY = "0x4AAAAAAFNXcGxm9JQyNYTX"
# Max størrelse pr. fil (MB), max filer pr. bidrag, max samlet størrelse pr. bidrag
# og max mængde pr. afsender (IP) pr. døgn.
MAX_FILE_MB = "2048"
MAX_FILES = "40"
MAX_SUBMISSION_GB = "10"
IP_DAILY_GB = "20"
# "post" = bidrag vises med det samme (kan skjules bagefter i /admin.html)
# "pre"  = bidrag skal godkendes i /admin.html, før de vises
MODERATION = "pre"
# Lad være tom: så går alle medier gennem workeren og holdes inden for udgiftsloftet.
MEDIA_BASE_URL = ""
# Repo hvis "Behandl uploads"-workflow omkoder filerne (kræver GITHUB_TOKEN-hemmeligheden).
GITHUB_REPO = "sloev/svendborg-skyline"
# Udgiftsloft (se src/worker.js). Værst tænkelige: (60 − 10) GB × $0,015 ≈ $0,75 pr. måned.
STORAGE_LIMIT_GB = "60"
CLASS_A_MONTHLY_LIMIT = "900000"
# De eneste sider, der må bruge API'et og filerne (CORS, afsender-tjek og Turnstile-hostname),
# kommasepareret. Kun det rigtige domæne og lokal udvikling.
ALLOWED_ORIGINS = "https://havn.skifting.net,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8787"
# Hjemmesidens adresse (delelinks og alt der ikke er API sendes hertil).
SITE_URL = "https://havn.skifting.net/"
# Døgnloft (se »døgnbudget« i src/worker.js). Under Free-planens grænser, så siden aldrig går helt i stå:
# læste/skrevne D1-rækker, filer hentet fra R2 og forespørgsler i alt.
D1_DAILY_READS = "3500000"
D1_DAILY_WRITES = "70000"
MEDIA_DAILY = "80000"
REQUESTS_DAILY = "90000"
# Vises i afsnittet om privatliv.
CONTACT_EMAIL = "fremmedartet@gmail.com"

# Hemmeligheder (sat som krypterede worker-hemmeligheder, aldrig i repoet):
#   TURNSTILE_SECRET  – Turnstile-hemmelighed
#   ADMIN_TOKEN       – lang tilfældig streng (mindst 32 tegn): adgangskode til /admin.html og processoren
#   IP_SALT           – tilfældig streng til hashing af IP-adresser
#   GITHUB_TOKEN      – GitHub-token (Contents: read & write), starter omkodning lige efter upload
