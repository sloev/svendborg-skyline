<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siden findes ikke – Siloerne på Østre Kaj</title>
  <script>
    // GitHub Pages serves this page for any missing path; point assets at the site root.
    (function () {
      // Delelink til et bidrag, hvis delesiden endnu ikke er lagt op: gå direkte til bidraget.
      var share = location.pathname.match(/\/s\/([\w-]{36})\/?$/);
      if (share) { location.replace(location.pathname.slice(0, share.index + 1) + '#bidrag/' + share[1]); return; }
      var parts = location.pathname.split('/');
      var root = location.hostname.endsWith('github.io') && parts[1] ? '/' + parts[1] + '/' : '/';
      document.write('<base href="' + root + '">');
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="section center">
    <h1>Siden findes ikke</h1>
    <p class="muted">Måske er den revet ned ligesom siloerne snart bliver.</p>
    <p><a class="btn btn-primary" href="./">Til forsiden</a></p>
  </main>
</body>
</html>
