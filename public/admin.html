<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.workers.dev https://*.tile.openstreetmap.org https://unpkg.com; media-src 'self' blob: https://*.workers.dev; connect-src 'self' https://*.workers.dev; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administration – Siloerne på Østre Kaj</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin">
    <form id="login" class="card" hidden>
      <h1>Administration</h1>
      <label class="field"><span>Adgangskode (ADMIN_TOKEN)</span><input type="password" id="token" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Log ind</button>
      <p class="form-error" id="login-error" hidden></p>
    </form>

    <div id="panel" hidden>
      <div class="admin-bar">
        <h1 class="admin-title">Bidrag</h1>
        <div class="actions">
          <select id="status">
            <option value="">Alle</option>
            <option value="review">Afventer godkendelse</option>
            <option value="published">Offentlige</option>
            <option value="hidden">Skjulte</option>
            <option value="uploading">Ufærdige uploads</option>
          </select>
          <button type="button" id="export">Hent eksport (JSON)</button>
          <button type="button" id="logout">Log ud</button>
        </div>
      </div>
      <p class="meta" id="counts"></p>
      <div id="list"></div>
      <div class="center"><button class="btn btn-ghost" id="more" hidden>Vis flere</button></div>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="admin.js" defer></script>
</body>
</html>
