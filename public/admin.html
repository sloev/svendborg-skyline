<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.workers.dev http://localhost:8787 https://*.tile.openstreetmap.org https://unpkg.com; media-src 'self' blob: https://*.workers.dev http://localhost:8787; connect-src 'self' https://*.workers.dev http://localhost:8787; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administration – Siloerne på Østre Kaj</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css?v=20261005a">
  <link rel="stylesheet" href="admin.css?v=20261005a">
</head>
<body>
  <main class="admin">
    <form id="login" class="card" hidden>
      <h1>Administration</h1>
      <label class="field"><span>Adgangskode (ADMIN_TOKEN)</span><input type="password" id="token" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Log ind</button>
      <p class="form-error" id="login-error" hidden></p>
    </form>

    <div id="panel" hidden>
      <div class="admin-bar">
        <h1 class="admin-title">Bidrag</h1>
        <div class="actions">
          <select id="view" aria-label="Visning">
            <option value="subs">Bidrag</option>
            <option value="comments">Kommentarer</option>
            <option value="map">Kort</option>
          </select>
          <select id="cstatus" hidden aria-label="Kommentarer">
            <option value="pending">Afventer godkendelse</option>
            <option value="published">Offentlige</option>
            <option value="hidden">Skjulte</option>
            <option value="">Alle</option>
          </select>
          <select id="status">
            <option value="review" selected>Afventer godkendelse</option>
            <option value="">Alle</option>
            <option value="published">Offentlige</option>
            <option value="hidden">Skjulte</option>
            <option value="uploading">Ufærdige uploads</option>
          </select>
          <label class="check admin-noloc"><input type="checkbox" id="noloc"> <span>Mangler placering</span></label>
          <button type="button" id="export">Hent eksport (JSON)</button>
          <button type="button" id="logout">Log ud</button>
        </div>
      </div>
      <p class="meta" id="counts"></p>
      <div id="list"></div>
      <div class="center"><button class="btn btn-ghost" id="more" hidden>Vis flere</button></div>
    </div>
  </main>
  <script src="config.js?v=20261005a"></script>
  <script src="editor.js?v=20261005a"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="admin.js?v=20261005a" defer></script>
</body>
</html>
