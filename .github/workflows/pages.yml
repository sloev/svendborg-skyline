name: Udgiv hjemmeside (GitHub Pages)

# Udgiver public/ på GitHub Pages. API'et ligger på Cloudflare-workeren; config.js skrives,
# så siden ved hvor den er (variablen WORKER_URL, eller slået op med Cloudflare-hemmelighederne).

on:
  push:
    branches: [master]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Skriv config.js
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url=$(.github/scripts/worker-url.sh)
          if [ -z "$url" ]; then echo "::error::Kunne ikke finde workerens adresse (tjek CLOUDFLARE_*-secrets eller sæt variablen WORKER_URL)"; exit 1; fi
          printf "window.SILO_CONFIG = { apiBase: %s };\n" "$(jq -Rn --arg u "$url" '$u')" > public/config.js
          cat public/config.js
          # Ny version i filnavnene ved hver udgivelse, så browsere ikke bruger gamle CSS/JS-filer.
          sed -i -E "s/\?v=[0-9a-z]+\"/?v=${GITHUB_SHA::10}\"/g" public/*.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
