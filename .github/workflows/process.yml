name: Behandl uploads

# Converts new uploads (photos → JPEG, video → MP4/H.264, sound → M4A), keeps their
# metadata and archives the originals in Google Drive.
#
# Started by the worker right after an upload (repository_dispatch), every hour as a
# fallback, or by hand from the Actions tab.
#
# Repository settings → Secrets and variables → Actions:
#   variables: WORKER_URL                        https://<your worker>
#              RCLONE_REMOTE                     e.g. gdrive:Siloerne   (optional)
#              DELETE_ORIGINALS_AFTER_ARCHIVE    true | false           (optional)
#   secrets:   ADMIN_TOKEN                       same value as the worker secret
#              RCLONE_CONFIG                     contents of rclone.conf (optional)

on:
  repository_dispatch:
    types: [process-media]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      export:
        description: 'Gem altid en ny eksport (bidrag.json) i Google Drive'
        type: boolean
        default: false

concurrency:
  group: process-media
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WORKER_URL: ${{ vars.WORKER_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      RCLONE_REMOTE: ${{ secrets.RCLONE_CONFIG != '' && vars.RCLONE_REMOTE || '' }}
      DELETE_ORIGINALS_AFTER_ARCHIVE: ${{ vars.DELETE_ORIGINALS_AFTER_ARCHIVE }}
      FORCE_EXPORT: ${{ github.event_name == 'repository_dispatch' || inputs.export }}
    steps:
      - name: Er der noget at lave?
        id: queue
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "WORKER_URL / ADMIN_TOKEN er ikke sat op – springer over."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pending=$(curl -fsS -H "Authorization: Bearer $ADMIN_TOKEN" "$WORKER_URL/api/admin/queue-size" | jq -r .pending)
          echo "Filer i kø: $pending"
          if [ "$pending" != "0" ] || [ "$FORCE_EXPORT" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.queue.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: processor/package-lock.json

      - name: Installer ffmpeg, exiftool, libheif, poppler, rclone
        if: steps.queue.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libimage-exiftool-perl libheif-examples poppler-utils rclone

      - name: Rclone-konfiguration
        if: steps.queue.outputs.run == 'true' && env.RCLONE_REMOTE != ''
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Behandl
        if: steps.queue.outputs.run == 'true'
        working-directory: processor
        run: |
          npm ci --no-audit --no-fund
          node process.mjs
