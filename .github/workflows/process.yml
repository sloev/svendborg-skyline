name: Behandl uploads

# Omkoder nye uploads (billeder → JPEG ≤ A3 @ 300 dpi, video → MP4/H.264 ≤ 1080p, lyd → M4A,
# PDF → Ghostscript) og bevarer deres metadata inkl. GPS. Workeren sletter originalerne.
#
# Startes af workeren lige efter en upload (repository_dispatch), hver time som sikkerhedsnet,
# eller i hånden fra Actions-fanen.
#
# Hemmeligheder: ADMIN_TOKEN, CLOUDFLARE_API_TOKEN og CLOUDFLARE_ACCOUNT_ID (bruges kun til at
# finde workerens adresse; ellers sæt variablen WORKER_URL).
#
# Repoet er offentligt, så logs er offentlige: der skrives aldrig personlige oplysninger ud.

on:
  repository_dispatch:
    types: [process-media]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: process-media
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Er der noget at lave?
        id: queue
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER_URL=$(.github/scripts/worker-url.sh || true)
          if [ -z "$WORKER_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "Worker / ADMIN_TOKEN er ikke sat op – springer over."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::add-mask::$WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          pending=$(curl -fsS -H "Authorization: Bearer $ADMIN_TOKEN" "$WORKER_URL/api/admin/queue-size" | jq -r .pending)
          echo "Filer i kø: $pending"
          if [ "$pending" != "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: processor/package-lock.json

      - name: Installer ffmpeg, exiftool, libheif, ghostscript, poppler
        if: steps.queue.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libimage-exiftool-perl libheif-examples ghostscript poppler-utils

      - name: Behandl
        if: steps.queue.outputs.run == 'true'
        working-directory: processor
        run: |
          npm ci --no-audit --no-fund
          node process.mjs
